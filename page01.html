

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #b0b0b0;
        }

        .header-icons {
            display: flex;
            gap: 15px;
        }

        .header-icons svg {
            width: 20px;
            height: 20px;
            fill: #b0b0b0;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
            border-bottom: 2px solid #555;
            transition: border-bottom-color 0.3s ease;
        }

        .form-group.active {
            border-bottom-color: #00bcd4; /* Color turquesa */
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .form-group label {
            position: absolute;
            top: 10px;
            left: 0;
            font-size: 16px;
            color: #888;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label,
        .form-group.active label {
            top: -15px;
            font-size: 12px;
            color: #00bcd4;
        }

        .form-group input:focus,
        .form-group select:focus {
            color: #00bcd4;
        }

        .form-group select {
            appearance: none;
        }

        .form-group select option {
            background-color: #2a2a2a;
            color: #fff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
        }
        
        .file-upload-container {
            width: 100%;
            height: 50px;
            background-color: #333;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            border: 2px dashed #555;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        .file-upload-container svg {
            width: 30px;
            height: 30px;
            fill: #555;
            transition: fill 0.3s ease;
        }

        .file-upload-container p {
            font-size: 14px;
            color: #888;
            margin-left: 10px;
            pointer-events: none;
        }

        .file-upload-container input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-path {
            font-size: 14px;
            color: #888;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            padding: 0 10px;
        }
        
        .file-upload-container:hover {
            border-color: #00bcd4;
        }

        .file-upload-container:hover svg {
            fill: #00bcd4;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
        }
        
        .buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .buttons button.submit {
            background-color: #00bcd4;
            color: #fff;
        }

        .buttons button.submit:hover {
            background-color: #0097a7;
            transform: translateY(-2px);
        }

        .buttons button.clear {
            background-color: #555;
            color: #fff;
        }

        .buttons button.clear:hover {
            background-color: #777;
            transform: translateY(-2px);
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icons">
                <!-- SVG Icons -->
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15.5h2V14h-2v3.5zm0-5.5h2V7h-2v5z"></path></svg>
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM6 10h2v4H6v-4zm3 0h2v4H9v-4zm3 0h2v4h-2v-4z"></path></svg>
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"></path></svg>
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM17 15h-2v-2h2v2zm0-4h-2V9h2v2zm-4 4h-2v-2h2v2zm0-4h-2V9h2v2zm-4 4H7v-2h2v2zm0-4H7V9h2v2z"></path></svg>
            </div>
        </div>

        <form action="#" method="post">
            <div class="form-group" id="name-group">
                <input type="text" id="name" name="name" placeholder=" " required>
                <label for="name">Name</label>
            </div>
            
            <div class="form-group" id="email-group">
                <input type="email" id="email" name="email" placeholder=" " required>
                <label for="email">E-mail</label>
            </div>
            
            <div class="form-group">
                <select id="item" name="item">
                    <option value="" disabled selected>Item</option>
                    <option value="item1">Item 1</option>
                    <option value="item2">Item 2</option>
                    <option value="item3">Item 3</option>
                </select>
            </div>
            
            <div class="file-upload-container">
                <svg viewBox="0 0 24 24">
                    <path d="M19 12h-2v-2h-2v2h-2v-2h-2v2H9v-2H7v2H5v2h2v2h2v-2h2v2h2v-2h2v2h2v-2zm-7 7c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                </svg>
                <span class="file-path" id="file-name">Drag and drop your image file here or click to upload</span>
                <input type="file" id="image-upload" name="image" accept="image/*">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">Do you agree?</label>
            </div>
            
            <div class="buttons">
                <button type="submit" class="submit">SUBMIT</button>
                <button type="reset" class="clear">CLEAR</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formGroups = document.querySelectorAll('.form-group');
            const fileInput = document.getElementById('image-upload');
            const fileNameSpan = document.getElementById('file-name');

            formGroups.forEach(group => {
                const input = group.querySelector('input, select');
                input.addEventListener('focus', () => {
                    group.classList.add('active');
                });
                input.addEventListener('blur', () => {
                    if (input.value === '') {
                        group.classList.remove('active');
                    }
                });
            });

            // Handles file drop
            const fileContainer = document.querySelector('.file-upload-container');
            fileContainer.addEventListener('dragover', (event) => {
                event.preventDefault();
                fileContainer.style.borderColor = '#00bcd4';
            });

            fileContainer.addEventListener('dragleave', () => {
                fileContainer.style.borderColor = '#555';
            });

            fileContainer.addEventListener('drop', (event) => {
                event.preventDefault();
                fileContainer.style.borderColor = '#555';
                const files = event.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    fileNameSpan.textContent = files[0].name;
                }
            });

            // Handles file input change
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    fileNameSpan.textContent = fileInput.files[0].name;
                } else {
                    fileNameSpan.textContent = 'Drag and drop your image file here or click to upload';
                }
            });
        });
    </script>
</body>
</html>
