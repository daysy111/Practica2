<!DOCTYPE html>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #121212;
        color: white;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        background-color: #1e1e1e;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }

      /* Barra superior con iconos SVG */
      .header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 15px;
        padding: 10px 0;
        border-bottom: 1px solid #333;
        margin-bottom: 20px;
      }

      .icon {
        width: 20px;
        height: 20px;
        fill: #aaa;
        cursor: pointer;
      }

      .icon:hover {
        fill: #fff;
      }

      /* Formulario */
      .form-group {
        margin-bottom: 20px;
        position: relative;
      }

      label {
        position: absolute;
        top: 12px;
        left: 15px;
        font-size: 14px;
        color: #aaa;
        pointer-events: none;
        transition: all 0.3s ease;
        z-index: 1;
      }

      input[type="text"],
      select,
      .image-input {
        width: 100%;
        padding: 12px 15px;
        background-color: #2d2d2d;
        border: 1px solid #444;
        color: white;
        border-radius: 5px;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
      }

      /* Estilo específico para select */
      select {
        appearance: none;
        -webkit-appearance: none;
        padding-right: 30px; /* Espacio para la flecha */
      }

      /* Flecha personalizada */
      .form-group::after {
        content: "▼";
        font-size: 12px;
        color: #aaa;
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        z-index: 1;
      }

      input[type="text"]:focus,
      select:focus,
      .image-input:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        color: white; /* ✅ mantiene el texto siempre blanco */
      }

      /* floating labels */
      input[type="text"].focused ~ label,
      select.focused ~ label,
      .image-input.focused ~ label,
      input[type="text"]:focus ~ label,
      select:focus ~ label,
      .image-input:focus ~ label {
        top: -8px;
        left: 8px;
        font-size: 12px;
        color: #007bff;
        background: #1e1e1e;
        padding: 0 5px;
        z-index: 2;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
      }

      .checkbox-group input {
        margin-right: 8px;
      }

      .button {
        padding: 10px 20px;
        margin-right: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }

      .button:hover {
        background-color: #0056b3;
      }

      .clear {
        background-color: #6c757d;
      }

      .clear:hover {
        background-color: #545b62;
      }

      /* Campo de imagen */
      .image-input {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #2d2d2d;
        border: 1px dashed #444;
        cursor: pointer;
        position: relative;
      }

      .image-input svg {
        width: 30px;
        height: 30px;
        fill: #aaa;
      }

      .image-input:hover {
        background-color: #3a3a3a;
      }

      .image-input.active {
        border-color: #007bff;
        background-color: #3a3a3a;
      }

      .file-path {
        margin-top: 5px;
        font-size: 12px;
        color: #999;
        text-align: center;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
