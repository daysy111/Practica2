<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>page02</title>
  <style>
    body {
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 40px;
    }
    /* --- Ejercicio A --- */
    .window {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      width: 650px;
      box-shadow: 0 0 10px #000;
      overflow: hidden;
    }
    .titlebar {
      background-color: #2b2f33;
      padding: 8px;
      display: flex;
      justify-content: flex-end;
      gap: 15px;
    }
    .titlebar svg {
      width: 20px;
      height: 20px;
      fill: #bbb;
      cursor: pointer;
    }
    .content {
      padding: 20px;
    }
    .control {
      display: flex;
      align-items: center;
      margin: 20px 0;
      gap: 10px;
    }
    .control label {
      flex: 1;
    }
    .control input[type="range"] {
      flex: 4;
    }
    .control svg {
      width: 22px;
      height: 22px;
      fill: #bbb;
    }

    /* --- Ejercicio B --- */
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      width: 350px;
      box-shadow: 0 0 10px #000;
      overflow: hidden;
    }
    .color-box {
      height: 150px;
      background-color: rgb(80, 165, 92);
      border-radius: 8px 8px 0 0;
    }
    .controls {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .rgb-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rgb-control label {
      width: 20px;
    }
    .rgb-control input[type="range"] {
      flex: 1;
    }
    .rgb-control input[type="number"] {
      width: 60px;
      padding: 4px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #2b2f33;
      color: #ccc;
    }
  </style>
</head>
<body>
  <!-- Ejercicio A -->
  <div class="window">
    <div class="titlebar">
      <!-- Íconos: sol, batería, clip y código -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="4"/>
          <line x1="12" y1="20" x2="12" y2="23"/>
          <line x1="1" y1="12" x2="4" y2="12"/>
          <line x1="20" y1="12" x2="23" y2="12"/>
          <line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/>
          <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>
          <line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/>
          <line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/>
        </g>
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <rect x="2" y="7" width="18" height="10" rx="2" ry="2" stroke="currentColor" fill="none" stroke-width="2"/>
        <rect x="4" y="9" width="10" height="6" fill="currentColor"/>
        <rect x="20" y="10" width="2" height="4" fill="currentColor"/>
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M16.5 6.5l-7.6 7.6a3 3 0 1 0 4.2 4.2l7.6-7.6a5 5 0 0 0-7.1-7.1l-8.5 8.5a7 7 0 1 0 9.9 9.9l6.4-6.4" 
              fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <polyline points="16 18 22 12 16 6" fill="none" stroke="currentColor" stroke-width="2"/>
        <polyline points="8 6 2 12 8 18" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>
    <div class="content">
      <!-- Controles -->
      <div class="control">
        <label>Media volume</label>
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
        <input type="range">
      </div>
      <div class="control">
        <label>Alarm volume</label>
        <input type="range">
        <svg viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0-8-8 8 8 0 0 0 8 8zm0-14a6 6 0 1 1-6 6 6 6 0 0 1 6-6z"/><path d="M12 8v4l3 3"/></svg>
      </div>
      <div class="control">
        <label>Icon click callback</label>
        <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
        <input type="range">
      </div>
    </div>
  </div>

  <!-- Ejercicio B -->
  <div class="card">
    <div class="color-box" id="colorBox"></div>
    <div class="controls">
      <div class="rgb-control">
        <label>R</label>
        <input type="range" id="rRange" min="0" max="255" value="80">
        <input type="number" id="rNumber" min="0" max="255" value="80">
      </div>
      <div class="rgb-control">
        <label>G</label>
        <input type="range" id="gRange" min="0" max="255" value="165">
        <input type="number" id="gNumber" min="0" max="255" value="165">
      </div>
      <div class="rgb-control">
        <label>B</label>
        <input type="range" id="bRange" min="0" max="255" value="92">
        <input type="number" id="bNumber" min="0" max="255" value="92">
      </div>
    </div>
  </div>

  <script>
    // --- Ejercicio B: sincronización sliders y numéricos ---
    const rRange = document.getElementById("rRange");
    const gRange = document.getElementById("gRange");
    const bRange = document.getElementById("bRange");
    const rNumber = document.getElementById("rNumber");
    const gNumber = document.getElementById("gNumber");
    const bNumber = document.getElementById("bNumber");
    const colorBox = document.getElementById("colorBox");

    function updateColor() {
      const r = rRange.value;
      const g = gRange.value;
      const b = bRange.value;
      colorBox.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
      rNumber.value = r;
      gNumber.value = g;
      bNumber.value = b;
    }

    function syncRangeNumber(range, number) {
      range.addEventListener("input", updateColor);
      number.addEventListener("input", () => {
        range.value = number.value;
        updateColor();
      });
    }

    syncRangeNumber(rRange, rNumber);
    syncRangeNumber(gRange, gNumber);
    syncRangeNumber(bRange, bNumber);

    updateColor(); // inicializar color
  </script>
</body>
</html>
