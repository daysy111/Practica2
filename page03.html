<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cree excelentes productos - Página de ejemplo</title>
  <style>
    /* ===== Variables / reset ligero ===== */
    :root{
      --orange: #ef5a1a; /* color naranja parecido a la imagen */
      --bg-light: #f2f2f2;
      --card-bg: #ffffff;
      --gutter: 24px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg-light);
      color:#222;
      -webkit-font-smoothing:antialiased;
    }

    /* ===== Hero (zona naranja superior) ===== */
    .hero{
      background: var(--orange);
      color: white;
      text-align:center;
      padding:64px 20px 48px;
    }
    .hero .wrap{
      max-width:1100px;
      margin:0 auto;
    }
    .hero h1{
      margin:0 0 12px;
      font-size:40px;
      line-height:1.05;
      font-weight:700;
      letter-spacing:0.2px;
    }
    .hero p.lead{
      margin:0 auto;
      max-width:760px;
      opacity:0.95;
      font-size:16px;
    }

    /* ===== Gallery wrapper ===== */
    .container{
      max-width:1100px;
      margin: -36px auto 60px; /* sube la galería para que parezca card sobre naranja */
      padding: 0 var(--gutter);
    }

    .gallery{
      display:flex;
      flex-wrap:wrap;
      gap:24px;
      justify-content:space-between;
    }

    .card{
      background: var(--card-bg);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      border-radius:6px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      width: calc(33.333% - 16px); /* 3 columnas por defecto (extra>1200) */
    }

    /* franja superior naranja como en la imagen */
    .card .stripe{
      background: var(--orange);
      height:18px;
      flex:0 0 18px;
    }

    .card .imgwrap{
      width:100%;
      /* altura fija para que todas las tarjetas coincidan visualmente */
      height:230px;
      overflow:hidden;
      display:block;
    }
    .card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      /* opacidad base (ajústala para que el hover aumente +10%) */
      opacity: 0.85;
      transition: opacity 220ms ease, transform 350ms cubic-bezier(.2,.9,.3,1);
    }
    /* Al poner el cursor sobre la imagen: opacidad 10% más (0.85 -> 0.95) */
    .card img:hover{
      opacity: 0.95;
      transform: scale(1.02);
    }

    /* pequeño pie opcional en la card */
    .card .caption{
      padding:12px 14px;
      font-size:14px;
      color:#444;
    }

    /* ===== Media queries (breakpoints solicitados) ===== */
    /* pequeño <480px -> 1 columna */
    @media (max-width: 479px){
      .hero{padding:40px 14px 28px}
      .hero h1{font-size:28px}
      .hero p.lead{font-size:14px}
      .container{margin-top:-24px}
      .card{width:100%}
      .card .imgwrap{height:160px}
    }

    /* mediano <900px -> 2 columnas */
    @media (max-width: 899px){
      .card{width: calc(50% - 12px)}
      .card .imgwrap{height:190px}
      .hero{padding:52px 16px}
      .hero h1{font-size:34px}
    }

    /* grande <1200px -> 3 columnas (se mantiene) */
    @media (max-width: 1199px){
      .card{width: calc(33.333% - 16px)}
      .card .imgwrap{height:210px}
    }

    /* ajustes para pantallas muy grandes (extra >1200) */
    @media (min-width: 1200px){
      .hero{padding:84px 20px 64px}
      .hero h1{font-size:48px}
      .container{margin-top:-44px}
      .card .imgwrap{height:240px}
    }

    /* pequeños refinamientos visuales */
    @media (prefers-reduced-motion: reduce){
      .card img{transition:none; transform:none}
    }
  </style>
</head>
<body>

  <header class="hero" role="banner">
    <div class="wrap">
      <h1>Cree excelentes productos</h1>
      <p class="lead">
        Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.
        Excepteur sint occaecat cupidatat non proident.
      </p>
    </div>
  </header>

  <main class="container" role="main">
    <section class="gallery" aria-label="Galería de productos">
      <!-- Card 1 -->
      <article class="card">
        <div class="stripe" aria-hidden="true"></div>
        <a class="imgwrap" href="#" aria-label="Ver producto 1">
          <img src="https://plus.unsplash.com/premium_photo-1661926736128-f2b643f91d1e?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8c2FsYSUyMGRlJTIwZXN0YXIlMjBtb2Rlcm5hfGVufDB8fDB8fHww" alt="Sala moderna con sofá" />
        </a>
        <div class="caption">Sala moderna</div>
      </article>

      <!-- Card 2 -->
      <article class="card">
        <div class="stripe" aria-hidden="true"></div>
        <a class="imgwrap" href="#" aria-label="Ver producto 2">
          <img src="https://images.unsplash.com/photo-1487017159836-4e23ece2e4cf?q=80&w=1200&auto=format&fit=crop" alt="Comedor minimalista" />
        </a>
        <div class="caption">Comedor minimalista</div>
      </article>

      <!-- Card 3 -->
      <article class="card">
        <div class="stripe" aria-hidden="true"></div>
        <a class="imgwrap" href="#" aria-label="Ver producto 3">
          <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop" alt="Cocina blanca" />
        </a>
        <div class="caption">Cocina blanca</div>
      </article>

      <!-- Card 4 -->
      <article class="card">
        <div class="stripe" aria-hidden="true"></div>
        <a class="imgwrap" href="#" aria-label="Ver producto 4">
          <img src="https://plus.unsplash.com/premium_photo-1661721905869-03b9aacd68a8?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8c2FsYSUyMGRlJTIwZXN0YXIlMjBtb2Rlcm5hfGVufDB8fDB8fHww" alt="Dormitorio elegante" />
        </a>
        <div class="caption">Dormitorio elegante</div>
      </article>

      <!-- Card 5 -->
      <article class="card">
        <div class="stripe" aria-hidden="true"></div>
        <a class="imgwrap" href="#" aria-label="Ver producto 5">
          <img src="https://images.unsplash.com/photo-1519710164239-da123dc03ef4?q=80&w=1200&auto=format&fit=crop" alt="Rincón con plantas" />
        </a>
        <div class="caption">Rincón con plantas</div>
      </article>

      <!-- Card 6 -->
      <article class="card">
        <div class="stripe" aria-hidden="true"></div>
        <a class="imgwrap" href="#" aria-label="Ver producto 6">
          <img src="https://www.panelpiedra.com/wp-content/uploads/panel-decorativo-icon-1000-1024x697.jpg" alt="Pared con paneles de madera" />
        </a>
        <div class="caption">Paneles de madera</div>
      </article>

    </section>
  </main>

</body>
</html>
